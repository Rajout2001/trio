<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription - Trio')}"></head>
<body class="trio-ui-theme trio-page trio-auth-page">

<main class="trio-shell trio-shell--narrow">
<div class="card trio-panel trio-auth-card">
    <img class="trio-auth-logo" th:src="@{/images/trio-ui/logo-trio.webp}" alt="Trio"/>
    <div class="h1" style="margin-bottom: 6px;">Créer un compte</div>
    <div class="sub" style="margin-bottom: 18px;">Rejoins l'aventure Trio !</div>

    <div th:if="${erreur}" class="alert" th:text="${erreur}"></div>

    <form class="form trio-form" th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="field">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="ex: alice@miage.fr"/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="field">
            <label>Pseudo</label>
            <input type="text" th:field="*{pseudo}" placeholder="ex: Alice"/>
            <div class="error" th:if="${#fields.hasErrors('pseudo')}" th:errors="*{pseudo}"></div>
        </div>

        <div class="field">
            <label>Mot de passe</label>
            <input type="password" th:field="*{password}" placeholder="8 caractères minimum"/>
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <button class="btn primary" type="submit" style="width:100%;">Créer mon compte</button>
    </form>

    <div class="sub trio-auth-footer">
        Déjà un compte ? <a class="trio-auth-link" th:href="@{/login}">Se connecter</a>
    </div>
</div>
</main>

</body>
</html>
