spring.application.name=trio-api
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/trio-db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
jwt.secret=${JWT_SECRET:change-this-secret-key-with-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
server.port=8080
