services:
  trio-api:
    container_name: trio-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    expose:
      - "8080"
    environment:
      JWT_SECRET: "change-this-secret-key-with-at-least-32-bytes"
      JWT_EXPIRATION_MS: "86400000"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/trio-db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1"
    volumes:
      - trio-api-data:/app/data
    networks:
      - trio-network

  trio-web:
    container_name: trio-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:8080"
    environment:
      TRIO_API_BASE_URL: "http://trio-api:8080"
    depends_on:
      - trio-api
    networks:
      - trio-network

networks:
  trio-network:
    name: trio-network

volumes:
  trio-api-data:
